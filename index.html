<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>シャドーイング</title>
<meta name="theme-color" content="#14120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="影读">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header id="hd">
  <button id="dayPrev" class="navbtn" aria-label="前の日">‹</button>
  <div class="hdmid">
    <div id="hdDate" class="hddate">—</div>
    <div id="hdTitle" class="hdtitle">読み込み中…</div>
  </div>
  <button id="dayNext" class="navbtn" aria-label="次の日">›</button>
</header>

<nav id="tabs">
  <button data-tab="mono" class="on">独白</button>
  <button data-tab="dialog">対話</button>
  <button data-tab="vocab">単語</button>
  <button data-tab="pat">型</button>
  <button data-tab="steps">練習</button>
</nav>

<main id="view"></main>

<footer id="player">
  <div id="seekwrap"><div id="seekfill"></div><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置"></div>
  <div class="prow main">
    <button id="prevS" class="pbtn" aria-label="前の文">◀◀</button>
    <button id="play" class="pbtn play" aria-label="再生">▶</button>
    <button id="nextS" class="pbtn" aria-label="次の文">▶▶</button>
    <button id="loop" class="pbtn" aria-label="一文リピート">🔁</button>
    <button id="rec" class="pbtn" aria-label="録音モード">🎙</button>
  </div>
  <div class="prow sub">
    <button id="trackBtn" class="chip">遅い</button>
    <div class="rate">
      <input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="1" aria-label="再生速度">
      <span id="rateVal">1.00x</span>
    </div>
    <button id="zhBtn" class="chip">中文</button>
  </div>
</footer>

<audio id="au" preload="auto"></audio>
<audio id="me" preload="none"></audio>
<script src="./app.js"></script>
</body>
</html>
